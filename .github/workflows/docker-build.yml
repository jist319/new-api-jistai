name: Publish Docker image (Multi-arch)

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: docker-tag-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Resolve and validate tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            echo "::error::A release tag is required"
            exit 1
          fi
          if ! TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}" 2>/dev/null); then
            echo "::error::Tag '$TAG' does not exist"
            exit 1
          fi
          HEAD_COMMIT=$(git rev-parse HEAD)
          CREATED=$(git show -s --format=%cI HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Tag '$TAG' resolves to $TAG_COMMIT but checkout is $HEAD_COMMIT"
            exit 1
          fi
          bash bin/validate-release-metadata.sh "$TAG"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "sha=${HEAD_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Building tag: ${TAG} for ${{ matrix.arch }} (prerelease=${IS_PRERELEASE})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}:${TAG}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Set version
        run: echo "TAG=${{ needs.build_single_arch.outputs.tag }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          mapfile -t DIGESTS < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#DIGESTS[@]}" -ne 2 ]; then
            echo "::error::Expected exactly two architecture digests, found ${#DIGESTS[@]}"
            exit 1
          fi
          SOURCES=()
          for DIGEST in "${DIGESTS[@]}"; do
            if ! [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest artifact '$DIGEST'"
              exit 1
            fi
            SOURCES+=("${{ env.IMAGE_NAME }}@sha256:$DIGEST")
          done
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${TAG} \
            "${SOURCES[@]}"

      - name: Create & push manifest (latest)
        if: needs.build_single_arch.outputs.is_prerelease == 'false'
        run: |
          mapfile -t DIGESTS < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#DIGESTS[@]}" -ne 2 ]; then
            echo "::error::Expected exactly two architecture digests, found ${#DIGESTS[@]}"
            exit 1
          fi
          SOURCES=()
          for DIGEST in "${DIGESTS[@]}"; do
            if ! [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest artifact '$DIGEST'"
              exit 1
            fi
            SOURCES+=("${{ env.IMAGE_NAME }}@sha256:$DIGEST")
          done
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:latest \
            "${SOURCES[@]}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign version manifest with cosign
        run: cosign sign --yes ${{ env.IMAGE_NAME }}:${TAG}

      - name: Sign latest manifest with cosign
        if: needs.build_single_arch.outputs.is_prerelease == 'false'
        run: cosign sign --yes ${{ env.IMAGE_NAME }}:latest

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${TAG} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Latest manifest summary
        if: needs.build_single_arch.outputs.is_prerelease == 'false'
        run: |
          echo "### Latest Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
