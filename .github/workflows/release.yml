name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

env:
  BUN_VERSION: '1.3.11'
  GO_VERSION: '1.26.1'

jobs:
  validate_release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate version and license notices
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::VERSION must contain one v-prefixed semantic version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=VERSION::VERSION '$VERSION' does not match tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          for file in LICENSE NOTICE THIRD-PARTY-LICENSES.md; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::$file is required and must not be empty"
              exit 1
            fi
          done
          if grep -Fq 'Transitive dependencies should be audited before a final external release.' THIRD-PARTY-LICENSES.md; then
            echo "::error file=THIRD-PARTY-LICENSES.md::Regenerate and audit the direct and transitive dependency inventory before publishing"
            exit 1
          fi
          if ! grep -Fq 'https://github.com/QuantumNous/new-api' NOTICE; then
            echo "::error file=NOTICE::Required upstream attribution link is missing"
            exit 1
          fi

  linux:
    name: Linux Release
    needs: validate_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build Frontend (default)
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          cd default
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
        run: |
          rm -rf web/node_modules web/default/node_modules web/classic/node_modules
          cd web
          bun install --filter ./classic --frozen-lockfile
          cd classic
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-arm64-$VERSION
      - name: Package Linux releases with license notices
        run: |
          for spec in "amd64:new-api-$VERSION" "arm64:new-api-arm64-$VERSION"; do
            ARCH=${spec%%:*}
            BINARY=${spec#*:}
            PACKAGE="new-api-linux-${ARCH}-${VERSION}"
            mkdir "$PACKAGE"
            cp "$BINARY" "$PACKAGE/new-api"
            cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$PACKAGE/"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "${PACKAGE}.tar.gz" "$PACKAGE"
          done
      - name: Generate checksums
        run: sha256sum new-api-linux-*-$VERSION.tar.gz > checksums-linux.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            new-api-linux-*.tar.gz
            checksums-linux.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Release
    needs: validate_release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build Frontend (default)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          cd default
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
        run: |
          rm -rf web/node_modules web/default/node_modules web/classic/node_modules
          cd web
          bun install --filter ./classic --frozen-lockfile
          cd classic
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-macos-$VERSION
      - name: Package macOS release with license notices
        run: |
          ARCH=$(go env GOARCH)
          PACKAGE="new-api-macos-${ARCH}-${VERSION}"
          mkdir "$PACKAGE"
          cp "new-api-macos-$VERSION" "$PACKAGE/new-api"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$PACKAGE/"
          COPYFILE_DISABLE=1 tar -czf "${PACKAGE}.tar.gz" "$PACKAGE"
      - name: Generate checksums
        run: shasum -a 256 new-api-macos-*-$VERSION.tar.gz > checksums-macos.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            new-api-macos-*.tar.gz
            checksums-macos.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Release
    needs: validate_release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build Frontend (default)
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          cd default
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
        run: |
          rm -rf web/node_modules web/default/node_modules web/classic/node_modules
          cd web
          bun install --filter ./classic --frozen-lockfile
          cd classic
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-$VERSION.exe
      - name: Package Windows release with license notices
        run: |
          ARCH=$(go env GOARCH)
          PACKAGE="new-api-windows-${ARCH}-${VERSION}"
          mkdir "$PACKAGE"
          cp "new-api-$VERSION.exe" "$PACKAGE/new-api.exe"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$PACKAGE/"
          7z a -tzip "${PACKAGE}.zip" "./${PACKAGE}/*"
      - name: Generate checksums
        run: sha256sum new-api-windows-*-$VERSION.zip > checksums-windows.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            new-api-windows-*.zip
            checksums-windows.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
