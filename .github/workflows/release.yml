name: Release (Linux, macOS, Windows)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false
  push:
    tags:
      - "*"
      - "!*-alpha*"

env:
  BUN_VERSION: "1.3.11"
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24.18.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate version and license notices
        shell: bash
        env:
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash bin/validate-release-metadata.sh "$EXPECTED_VERSION"

  quality:
    name: Release quality gates
    needs: validate_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test backend packages
        run: go test ./setting ./model ./middleware ./router ./bin
      - name: Test backend packages with race detector
        run: go test -race ./setting ./model ./middleware
      - name: Test fast third-party license verifier
        run: node --test bin/license-audit/verify-license-lock.test.cjs
      - name: Test frontend build-version verifier
        run: node --test web/default/scripts/verify-build-version.node.mjs
      - name: Verify third-party license bundle
        run: bash bin/license-audit/run.sh --check
      - name: Install frozen frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test, typecheck, and build Default frontend
        working-directory: web/default
        run: |
          bun test
          bun run typecheck
          VITE_REACT_APP_VERSION="$VERSION" bun run build
          node scripts/verify-build-version.mjs --dist dist --version "$VERSION"
      - name: Build Classic frontend
        working-directory: web/classic
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

  linux:
    name: Linux Release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build Frontend (default)
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile --ignore-scripts
          cd default
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          node scripts/verify-build-version.mjs --dist dist --version "$VERSION"
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
        run: |
          cd web/classic
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -trimpath -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-arm64-$VERSION
      - name: Package Linux releases with license notices
        run: |
          for spec in "amd64:new-api-$VERSION" "arm64:new-api-arm64-$VERSION"; do
            ARCH=${spec%%:*}
            BINARY=${spec#*:}
            PACKAGE="new-api-linux-${ARCH}-${VERSION}"
            mkdir "$PACKAGE"
            cp "$BINARY" "$PACKAGE/new-api"
            mkdir -p "$PACKAGE/third_party/licenses"
            cp LICENSE NOTICE THIRD-PARTY-LICENSES.md VENDORED-SOURCES.json "$PACKAGE/"
            cp third_party/licenses/*.txt "$PACKAGE/third_party/licenses/"
            go run ./bin/release_packager.go \
              -format tar.gz \
              -source "$PACKAGE" \
              -output "${PACKAGE}.tar.gz"
          done
      - name: Generate checksums
        run: sha256sum new-api-linux-*-$VERSION.tar.gz > checksums-linux.txt
      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: |
            new-api-linux-*.tar.gz
            checksums-linux.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  macos:
    name: macOS Release
    needs: quality
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build Frontend (default)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile --ignore-scripts
          cd default
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          node scripts/verify-build-version.mjs --dist dist --version "$VERSION"
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
        run: |
          cd web/classic
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Backend
        run: |
          go mod download
          go build -trimpath -ldflags "-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-macos-$VERSION
      - name: Package macOS release with license notices
        run: |
          ARCH=$(go env GOARCH)
          PACKAGE="new-api-macos-${ARCH}-${VERSION}"
          mkdir "$PACKAGE"
          cp "new-api-macos-$VERSION" "$PACKAGE/new-api"
          mkdir -p "$PACKAGE/third_party/licenses"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md VENDORED-SOURCES.json "$PACKAGE/"
          cp third_party/licenses/*.txt "$PACKAGE/third_party/licenses/"
          go run ./bin/release_packager.go \
            -format tar.gz \
            -source "$PACKAGE" \
            -output "${PACKAGE}.tar.gz"
      - name: Generate checksums
        run: shasum -a 256 new-api-macos-*-$VERSION.tar.gz > checksums-macos.txt
      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            new-api-macos-*.tar.gz
            checksums-macos.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  windows:
    name: Windows Release
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
      - name: Build Frontend (default)
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile --ignore-scripts
          cd default
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          node scripts/verify-build-version.mjs --dist dist --version "$VERSION"
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
        run: |
          cd web/classic
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Backend
        run: |
          go mod download
          go build -trimpath -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api.exe
      - name: Package Windows release with license notices
        run: |
          ARCH=$(go env GOARCH)
          PACKAGE="new-api-windows-${ARCH}-${VERSION}"
          mkdir "$PACKAGE"
          cp new-api.exe "$PACKAGE/new-api.exe"
          mkdir -p "$PACKAGE/third_party/licenses"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md VENDORED-SOURCES.json "$PACKAGE/"
          cp third_party/licenses/*.txt "$PACKAGE/third_party/licenses/"
          go run ./bin/release_packager.go \
            -format zip \
            -source "$PACKAGE" \
            -output "${PACKAGE}.zip"
      - name: Build Electron application
        run: |
          cd electron
          ELECTRON_VERSION=${VERSION#v}
          npm ci
          npm run build:win -- --config.extraMetadata.version="$ELECTRON_VERSION"
          cd ..
      - name: Generate checksums
        run: |
          sha256sum new-api-windows-*-$VERSION.zip > checksums-windows.txt
          (cd electron/dist && sha256sum *.exe) > checksums-electron.txt
      - name: Upload Windows and Electron release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            new-api-windows-*.zip
            checksums-windows.txt
            checksums-electron.txt
            electron/dist/*.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  docker_release:
    name: Publish signed multi-arch Docker image
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    name: Publish complete release
    needs: [linux, macos, windows, docker_release]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.txt
            release-assets/electron/dist/*.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
