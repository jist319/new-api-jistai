name: Publish Docker image (manual branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to build (e.g. alpha, nightly)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: docker-branch-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Docker tags
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.version.outputs.branch }}
      created: ${{ steps.version.outputs.created }}
      sha: ${{ steps.version.outputs.sha }}
      tag_prefix: ${{ steps.version.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: refs/heads/${{ inputs.branch }}

      - name: Validate distribution metadata
        run: bash bin/validate-release-metadata.sh

      - name: Resolve Docker tags
        id: version
        env:
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          SAFE_BRANCH=${SAFE_BRANCH:0:98}
          SAFE_BRANCH=$(printf '%s' "$SAFE_BRANCH" | sed -E 's/[.-]+$//')
          if [ -z "$SAFE_BRANCH" ]; then
            echo "::error::Branch '$BRANCH_NAME' cannot be converted to a valid Docker tag prefix"
            exit 1
          fi
          TAG_PREFIX="branch-${SAFE_BRANCH}"

          SHA=$(git rev-parse HEAD)
          CREATED=$(git show -s --format=%cI HEAD)
          SHORT_SHA=${SHA:0:12}
          VERSION="${TAG_PREFIX}-sha-${SHORT_SHA}"

          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Prepared Docker tags for $BRANCH_NAME at $SHORT_SHA"

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Validate distribution metadata
        run: bash bin/validate-release-metadata.sh

      - name: Write VERSION
        run: |
          echo "${{ needs.prepare.outputs.version }}" > VERSION
          echo "Publishing version: ${{ needs.prepare.outputs.version }} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Output digest
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    concurrency:
      group: docker-branch-manifest-${{ needs.prepare.outputs.tag_prefix }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: branch-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (GHCR - branch)
        run: |
          mapfile -t DIGESTS < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#DIGESTS[@]}" -ne 2 ]; then
            echo "::error::Expected exactly two architecture digests, found ${#DIGESTS[@]}"
            exit 1
          fi
          SOURCES=()
          for DIGEST in "${DIGESTS[@]}"; do
            if ! [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest artifact '$DIGEST'"
              exit 1
            fi
            SOURCES+=("${{ env.IMAGE_NAME }}@sha256:$DIGEST")
          done
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag_prefix }} \
            "${SOURCES[@]}"

      - name: Create & push manifest (GHCR - versioned)
        run: |
          mapfile -t DIGESTS < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#DIGESTS[@]}" -ne 2 ]; then
            echo "::error::Expected exactly two architecture digests, found ${#DIGESTS[@]}"
            exit 1
          fi
          SOURCES=()
          for DIGEST in "${DIGESTS[@]}"; do
            if ! [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest artifact '$DIGEST'"
              exit 1
            fi
            SOURCES+=("${{ env.IMAGE_NAME }}@sha256:$DIGEST")
          done
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} \
            "${SOURCES[@]}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifests with cosign
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag_prefix }}
          cosign sign --yes ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}

      - name: Output manifest digest
        run: |
          echo "### Multi-arch Manifest Digests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag_prefix }} >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
